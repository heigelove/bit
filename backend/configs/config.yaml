  password: "123456"
  db: 8
  prefix: "bit"
  ttl: 24h

api:
  listen: ":8080"
  username: "admin"
  password: "admin123"
  jwt_secret: "bit-dev-secret-change-me"
  token_ttl: 24h

paper:
  initial_balance: 10000
  fee_rate: 0.0004         # taker 约 0.04%
  slippage_bps: 2          # 滑点 2 bps
