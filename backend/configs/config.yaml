# ETHUSDT 永续 · 中短期趋势策略
mode: paper # paper | live

exchange:
  rest_base: "https://fapi.binance.com"
  ws_base: "wss://fstream.binance.com"
  # 测试网可改为:
  # rest_base: "https://testnet.binancefuture.com"
  # ws_base: "wss://stream.binancefuture.com"
  # 密钥优先级：环境变量 > 同目录/.env > 下方 api_key / api_secret
  #   复制 .env.example 为 .env 后填写 BINANCE_API_KEY / BINANCE_API_SECRET
  #   Windows PowerShell:  $env:BINANCE_API_KEY="你的key"; $env:BINANCE_API_SECRET="你的secret"
  # api_key_env: "BINANCE_API_KEY"
  # api_secret_env: "BINANCE_API_SECRET"
  api_key: "0Bk3juKW8YHtEiBFapebFX8k7A3q9YE4Pl1NjVoj3nMWDagVWA0Eg16913YgnMuY"
  api_secret: "yGxfx7huaPGoAYm4amGEAZFVCDg9GWaV79wsWfVRmSnCVV3h5STtjwxmAC84JjR6"

symbol:
  name: "ETHUSDT"
  quote: "USDT"
  leverage: 5
  margin_type: "CROSSED" # CROSSED | ISOLATED

timeframes:
  primary: "1h"   # 大周期：确认趋势方向
  entry: "15m"    # 小周期：趋势策略进场与跟踪止损（squeeze 仍只用 primary）

strategy:
  name: "trend"      # trend = EMA 回调续势 | squeeze = 波动压缩突破 | vegas = 维加斯通道
  atr_period: 14       # ATR 周期（两套策略共用）
  min_bars: 220        # 至少需要的历史 K 线（两套策略共用）

  # 仅 name: trend 时生效
  trend:
    ema_fast: 20
    ema_slow: 60
    ema_filter: 200
    adx_period: 14
    adx_min: 25            # ADX 低于此值视为震荡，不开新仓
    atr_stop_mult: 1.5     # 初始止损 = max(1h 摆动点, 1h ATR * 倍数)
    atr_trail_mult: 2.0    # 跟踪止损按 1h ATR，给趋势空间
    chase_max_atr: 1.5     # 价格距 15m EMA20 超过此倍数 ATR 禁止追单
    use_ema200_filter: true
    # 震荡过滤：ADX 下行 / 均线纠缠 / DI 背离 / 慢线走平 时拒绝开仓
    adx_rising_bars: 2     # 弱趋势里要求 ADX 高于 N 根前
    adx_rising_exempt: 30  # ADX 已 ≥ 30 时不再要求继续抬升（单边行情 ADX 会见顶回落）
    ema_sep_min_atr: 1.0   # |EMA20−EMA60| 至少 1.0×1h ATR，挡住均线刚粘上的弱反抽
    ema_slope_bars: 5      # 慢线斜率回看根数
    ema_slope_min_atr: 0.08 # 慢线 N 根变化至少 0.08×ATR，过滤走平
    use_di_filter: true    # 多头需 +DI > −DI，空头相反
    cross_adx_bonus: 5     # 单周期新鲜 EMA 金叉/死叉需 ADX ≥ adx_min+5
    min_stop_atr: 1.2      # 止损距至少 1.2×1h ATR；过近则拉宽（不是拒绝）
    widen_min_stop: true
    use_htf_atr: true      # 止损/跟踪用 1h ATR，避免 15m 噪声扫出
    trail_after_r: 1.0     # 浮盈未到 1R 前不收紧止损
    pullback_htf_max_atr: 0.8  # 弱趋势：15m 入场必须靠近 1h EMA20
    continuation_adx: 28       # ADX ≥ 28 才做旗形；再抬高会漏掉单边里的大单
    continuation_htf_max_atr: 0  # 0 = 延续单不限制距 1h EMA20（仍须 15m 回踩 EMA20）
    require_bar_confirm: true  # 入场 K 线必须收在顺势一侧
    close_confirm_frac: 0.55
    allow_ltf_cross: false     # 关掉 15m EMA 金叉/死叉（噪声大）
    allow_ltf_pullback: false  # 关掉 15m 回踩入场：容易被下一根 1h 收盘打脸
    allow_htf_cross: true      # 1h EMA20/60 交叉可开仓（抓趋势起点）
    allow_htf_pullback: true   # 1h 回踩 EMA20
    htf_pullback_confirm: true # 回踩当根不进，下一根 1h 仍站上均线才进（过滤假收回）
    htf_pullback_min_atr: 0.15 # 确认根收盘须离开 EMA20 至少 0.15×ATR
    allow_htf_flag: true       # 单边：1h 收缩停顿后再突破（不必回到 EMA20）
    flag_pause_bars: 3         # 突破前至少 3 根 1h 停在更早那根的高/低之内
    flag_max_range_atr: 1.5    # 停顿区间不超过 1.5×1h ATR，过滤宽幅震荡
    flag_min_break_atr: 0.15   # 收盘须打穿停顿端 0.15×ATR，过滤假突破
    flag_max_ext_atr: 2.5      # 离 1h EMA20 超过 2.5×ATR 不追
    exit_on_ema20_loss: false  # 持仓不因「收盘丢 EMA20」立刻平：那是入场位，会把止损变成几块钱
    # 止损后禁止立刻在同一 EMA 再进
    reentry_atr: 0.25      # |现价−上次开仓价| 小于此×ATR 则拒绝
    reentry_cooldown: 4    # 离场后至少再等 N 根入场周期 K 线（15m）
    require_reset: true    # 必须先出现一根完全离开 EMA20 的 K 线
    reentry_htf_reset: true # 15m 离开均线还不够，1h 也要重新站上/跌破 EMA20
    # 方向失效：EMA20/60 还没交叉，但 1h 收盘或现价已跌破 EMA20 时禁止新多（空头相反）
    require_ema20_side: true

  # 仅 name: squeeze 时生效
  squeeze:
    donchian: 20             # 突破通道长度（不含当前 K 线）
    atr_lookback: 100        # ATR% 分位统计窗口
    atr_pct_max: 0.2         # ATR% 分位高于此值视为已扩张，不开新仓
    atr_stop_mult: 1.2       # 初始止损距离 = ATR * 倍数，1R 由此定义
    breakout_max_atr: 1.0    # 突破点距通道轨超过此倍数 ATR 则放弃追单
    trend_ema: 200           # 方向偏置过滤均线
    use_trend_filter: true
    chandelier_period: 22    # 吊灯止损回看长度
    chandelier_mult: 3.0     # 吊灯止损 ATR 倍数
    tp1_r: 1.0               # 第一目标（R 倍数）
    tp1_portion: 0.5         # 到达 TP1 平掉的仓位比例
    breakeven_after_tp1: true # TP1 后止损抬到成本价
    time_stop_bars: 12       # 持仓超过此根数仍无进展则离场
    time_stop_min_r: 0.5     # 时间止损的最低进展要求
    use_funding_filter: true
    funding_abs_max: 0.0005  # 资金费率绝对值超过 0.05%/8h 时禁止顺该方向开仓
    # 止损后禁止立刻在同一突破位再进
    reentry_atr: 0.25        # |现价−上次开仓价| 或 |通道沿−上次沿| 小于此×ATR 则拒绝
    reentry_cooldown: 2      # 离场后至少再等 N 根主周期 K 线
    require_reset: true      # 必须先收盘回到通道内，才允许下一次穿越

  # 仅 name: vegas 时生效。周期用这里的 interval，不跟 timeframes.primary。
  # 只做通道刚排好后的回踩，拿住单边，直到 144/169 再次交叉。不设固定止盈。
  vegas:
    interval: "4h"           # 1h 回踩胜率在后一段行情里站不住，4h 才是这套参数的周期
    entry_mode: breakout     # pullback = 已在通道外再回踩 | breakout = 从通道另一侧穿出
    ema_fast: 12             # 动量过滤
    ema_tunnel_fast: 144     # 通道上沿/下沿的一条
    ema_tunnel_slow: 169     # 通道另一条
    slope_bars: 8
    slope_min_atr: 0.15      # 慢隧道 8 根内至少走 0.15×ATR，过滤走平
    adx_period: 14
    adx_min: 25              # ADX 低于此值不开仓；0 表示关闭
    establish_bars: 10       # 回踩前这么多根内必须有收盘在通道趋势一侧
    min_stack_age: 0         # 0 = 不要求通道排列已经持续多久
    max_stack_age: 120       # 只做排列后的前 120 根（4h 约 20 天），不接趋势末端的回踩
    touch_atr: 0.8           # 影线进入近端通道 0.8×ATR 内算回踩
    reclaim_min_atr: 0.05    # 确认收盘须重新离开近端
    chase_max_atr: 2.5       # 离开通道超过此倍数不追
    pierce_max_atr: 0.35     # 回踩收盘跌破远端超过此倍数则放弃
    atr_stop_mult: 0.25      # 止损在回踩极值/远端之外再垫这么多 ATR
    min_stop_atr: 1.0        # 更近则拉宽到 1×ATR
    atr_trail_mult: 8        # 跟踪放得很宽，正常回踩碰不到
    trail_bars: 12
    trail_after_r: 3         # 浮盈未到 3R 不收紧，避免单边中途被扫掉
    tp_r: 1.5                # 仅 use_tp 打开时生效
    tp_portion: 0            # 0 = 全平；(0,1) = 先减仓
    use_tp: false            # 不设固定止盈，单边交给通道翻转和宽跟踪
    breakeven_after_r: 0     # 0 = 不推保本
    time_stop_bars: 0        # 0 = 关闭时间止损
    time_stop_min_r: 0
    require_bar_confirm: true
    close_confirm_frac: 0.55
    require_stack: true      # 多头要求 EMA144 > EMA169
    require_fast_side: true  # EMA12 必须在通道趋势一侧
    require_fast_turn: false
    require_swing: false
    exit_on_tunnel_loss: false # 回到通道近端是回踩，不是离场
    exit_on_stack_flip: true   # EMA144 穿回 EMA169 才认为这段单边结束
    reentry_atr: 0.25
    reentry_cooldown: 4
    require_reset: true      # 止损后要先有一根完全离开通道的 K 线

risk:
  risk_per_trade: 0.0075   # 单笔风险 0.75% 权益
  max_total_risk: 0.03     # 同方向总风险上限
  max_daily_loss_r: 2.0    # 当日亏损达 2R 停手
  max_consecutive_loss: 3  # 连续亏损笔数停手
  max_notional_pct: 0.7    # 名义价值上限 = 权益 * 杠杆 * 此值
  min_qty: 0.001           # ETH 最小下单量（按交易所规则）
  qty_precision: 3
  price_precision: 2

engine:
  poll_interval: 10s       # paper / REST 轮询间隔
  kline_limit: 500
  log_dir: "logs"

sqlite:
